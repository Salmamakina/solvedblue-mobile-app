# Pull request gate for the mobile app.
#
# Nothing merges unless the app typechecks, lints and bundles. Make this
# workflow required in the branch protection rules for `main`, otherwise the
# gate is advisory only.
#
# Mirrors the conventions in the Spyder monorepo's .github/workflows/ci.yml:
# Node 22, npm ci against the committed lockfile, typecheck as the merge gate.
# This repo is deliberately separate from that monorepo, so releasing the app
# never triggers a backend or web deploy, and the monorepo's `v*` deploy tag
# cannot collide with anything here.

name: CI

on:
  pull_request:
    branches: [main, staging]
  # Both long-lived branches are checked on push too: `staging` because an OTA
  # update goes out from it, `main` because a production build is cut from it.
  push:
    branches: [main, staging]

# A new push to a PR makes the previous run irrelevant.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, lint and bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Expo 58 wants ^22.13 || ^24.3 || ^26 || >=27.
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Deliberately before the typecheck, and the reason is not obvious.
      #
      # `experiments.typedRoutes` is on, so `Href` is only as strict as
      # .expo/types/router.d.ts says. That file is generated and git-ignored, so
      # a fresh checkout would otherwise typecheck against a permissive `Href`
      # and a bad `router.push('/campaign/1')` would sail through the gate.
      #
      # Exporting writes it (verified on SDK 58 — `expo customize tsconfig.json`,
      # which the typed-routes doc suggests for CI, does not), and bundling also
      # catches resolution and native-import errors that tsc cannot see.
      - name: Bundle, and generate the typed route definitions
        run: npx expo export --platform ios

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npx expo lint

  # Advisory, and it must stay that way. Read this before "fixing" it.
  #
  # `expo-doctor` compares the installed packages against the newest patch
  # releases in the npm and Expo registries. Expo ships patches most weeks, so
  # its "packages match versions required by installed Expo SDK" check goes red
  # on its own, with no commit involved. Gating merges on that would turn every
  # pull request red for reasons the author did not cause — which is how a team
  # learns to ignore red crosses.
  #
  # `continue-on-error` therefore means: the workflow stays green, and a red
  # cross here is a prompt to run `npx expo install --fix`, not a blocked merge.
  #
  # It earns its place regardless. On its first CI run it caught three things
  # that tsc, lint and the bundler are all blind to: a missing peer dependency
  # (`react-native-worklets`, required by react-native-reanimated 4.x) that
  # would have crashed any build outside Expo Go, and two `app.json` fields
  # removed from the SDK 58 schema (`newArchEnabled`, and top-level `splash`,
  # which now belongs in the expo-splash-screen plugin's options).
  doctor:
    name: Dependency doctor (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # `--yes` is load-bearing, and the reason is worth knowing: without it,
      # npx stops to ask "Need to install expo-doctor@x. Ok to proceed?" and
      # waits for a keypress. That is what made it look like it hung for 15
      # minutes locally — it was never slow, it was blocked on stdin. CI gets
      # away with it only because npx auto-confirms when stdout is not a TTY.
      - name: Check SDK dependency health
        run: npx --yes expo-doctor
